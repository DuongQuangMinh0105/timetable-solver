services:
  postgres:
    image: postgres:17-alpine
    container_name: timetable-postgres
    environment:
      POSTGRES_DB: timetable
      POSTGRES_USER: timetable
      POSTGRES_PASSWORD: timetable_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetable -d timetable"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: timetable-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetable-migrate
    environment:
      DATABASE_URL: postgresql+psycopg://timetable:timetable_dev@postgres:5432/timetable
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetable-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://timetable:timetable_dev@postgres:5432/timetable
      STORAGE_DIR: /app/data/storage
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage_data:/app/data/storage
    command:
      - uv
      - run
      - --no-sync
      - uvicorn
      - timetable.interfaces.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetable-worker
    environment:
      DATABASE_URL: postgresql+psycopg://timetable:timetable_dev@postgres:5432/timetable
      STORAGE_DIR: /app/data/storage
      REDIS_URL: redis://redis:6379/0
    volumes:
      - storage_data:/app/data/storage
    command:
      - uv
      - run
      - --no-sync
      - python
      - -m
      - timetable.interfaces.worker.main
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  storage_data: