[project]
name = "timetable"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "ortools>=9.15.6755",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
